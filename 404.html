<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>找不到頁面｜EliNotebook</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/EliNotebook.github.io/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/EliNotebook.github.io/images/icons/apple-touch-icon.png">
  <style>
    :root{--paper:#f4f1ed;--ink:#2f2f2f;--muted:#716e6a;--deep:#37413a;--gold:#7c6e36;--line:rgba(47,47,47,.16);color-scheme:light}
    @media(prefers-color-scheme:dark){:root{--paper:#12100e;--ink:#ece7df;--muted:#a49f96;--deep:#1d241f;--gold:#d3bd6e;--line:rgba(236,231,223,.18);color-scheme:dark}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
      padding:clamp(24px,6vw,64px) max(20px,env(safe-area-inset-left,0px)) calc(clamp(24px,6vw,64px) + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));
      background:var(--paper);color:var(--ink);
      font-family:"Noto Serif TC","Songti TC","Times New Roman",serif;line-height:1.8;-webkit-text-size-adjust:100%}
    main{max-width:620px;width:100%}
    .code{font:600 11px Arial,sans-serif;letter-spacing:.25em;color:var(--gold);margin:0 0 14px;display:flex;align-items:center;gap:12px}
    .code:before{content:"";width:38px;height:1px;background:var(--gold);flex:none}
    h1{font-size:clamp(30px,7vw,52px);font-weight:500;margin:0 0 16px;line-height:1.2}
    p{color:var(--muted);font-size:15px;margin:0 0 12px}
    ul{list-style:none;padding:0;margin:32px 0 0;display:grid;gap:10px}
    a{color:inherit;text-decoration:none}
    li a{display:flex;align-items:center;justify-content:space-between;gap:16px;
      border:1px solid var(--line);padding:16px 18px;min-height:56px;transition:background .18s,border-color .18s}
    li a:hover,li a:focus-visible{background:var(--deep);color:#f7f4ef;border-color:var(--deep)}
    li a span{font-size:15px}
    li a i{font-style:normal;font-size:12px;opacity:.7;flex:none}
    :focus-visible{outline:3px solid var(--gold);outline-offset:4px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 404</p>
    <h1>這個頁面不存在</h1>
    <p>網址可能輸入錯誤，或該頁面已經移除、更名。</p>
    <ul>
      <li><a href="/EliNotebook.github.io/"><span>回到首頁</span><i>→</i></a></li>
      <li><a href="/EliNotebook.github.io/financial-tools.html"><span>金融工具中心</span><i>→</i></a></li>
    </ul>
  </main>
</body>
</html>
