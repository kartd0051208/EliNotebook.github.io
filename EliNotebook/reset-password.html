<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#37413a">
  <title>EliNotebook｜重設帳號密碼</title>
  <link rel="stylesheet" href="./style/auth.css?v=1.0.0">
</head>
<body data-auth-page="reset">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <a class="auth-brand" href="../index.html"><span>E</span><div><strong>EliNotebook</strong><small>ONE-TIME RECOVERY</small></div></a>
      <p class="eyebrow">PASSWORD RECOVERY</p>
      <h1 id="auth-title">重設帳號密碼</h1>
      <p class="auth-intro">只有從已註冊信箱收到、仍在有效時間內且尚未使用的一次性連結可以進入此流程。</p>

      <form id="reset-password-form" class="auth-form" hidden>
        <label>新帳號密碼<input name="password" type="password" minlength="15" maxlength="64" autocomplete="new-password" placeholder="至少15個字元" required></label>
        <label>再次輸入<input name="confirmation" type="password" minlength="15" maxlength="64" autocomplete="new-password" required></label>
        <button class="primary-button" type="submit">更新密碼並登出其他裝置</button>
      </form>

      <p class="auth-status" id="auth-status" role="status" aria-live="polite">正在驗證一次性連結……</p>
      <aside><strong>財務資料提醒</strong><p>這一階段只重設Supabase帳號密碼，不會假裝已經復原本機AES財務密碼。加密金鑰復原必須等後端金鑰包裝機制完成後才能啟用。</p></aside>
      <a class="local-link" href="./account-login.html">返回帳號登入</a>
    </section>
  </main>
  <script src="./javascript/auth-config.js"></script>
  <script src="./vendor/supabase/supabase.js"></script>
  <script src="./javascript/auth-client.js" defer></script>
</body>
</html>
